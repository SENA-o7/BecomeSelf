services:
  db:
    image: postgres:17
    container_name: becomeself-db
    environment:
      POSTGRES_USER: becomeself
      POSTGRES_PASSWORD: becomeself
      POSTGRES_DB: becomeself
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U becomeself -d becomeself"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
